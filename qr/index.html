* { box-sizing:border-box; }

.moldura {

}
.alternativa { margin:0; font-size:.95rem; color:var(--soft); max-width:34ch; }
.imprimir {
  min-height:48px; padding:.65rem 1.3rem; background:var(--accent); color:#fff;
  border:none; border-radius:10px; font:inherit; font-weight:700; cursor:pointer;
}
@media (prefers-color-scheme: dark) { .imprimir { color:#10171e; } }
.voltar { color:var(--accent); font-weight:600; text-decoration:none; }
:focus-visible { outline:3px solid #b3540a; outline-offset:3px; }

@media print {
  @page { size:A4 portrait; margin:16mm; }
  body { background:#fff; color:#000; min-height:auto; justify-content:flex-start; gap:1.2rem; }
  .imprimir, .voltar { display:none; }
  .moldura { box-shadow:none; border:2px solid #000; width:min(70vw,120mm); }

}
